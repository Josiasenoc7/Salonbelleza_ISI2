{% extends 'base.html' %}
{% block content %}
<h1>Eliminar Usuario</h1>
<p>¿Estás seguro de eliminar al usuario "{{ usuario.nombre }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>
<a href="{% url 'lista_usuarios' %}">Cancelar</a>
{% endblock %}
