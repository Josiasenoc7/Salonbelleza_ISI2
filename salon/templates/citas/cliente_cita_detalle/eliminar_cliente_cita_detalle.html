{% extends 'base.html' %}
{% block content %}
<h1>Eliminar Detalle Cliente Cita</h1>
<p>¿Estás seguro de eliminar el detalle del cliente "{{ cliente_cita_detalle.cliente }}" para la cita "{{ cliente_cita_detalle.cita }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>
<a href="{% url 'lista_cliente_cita_detalle' %}">Cancelar</a>
{% endblock %}
