{% extends 'base.html' %}
{% block content %}
<h1>Eliminar Cita</h1>
<p>¿Estás seguro de eliminar la cita del cliente "{{ cita.cliente }}" en la fecha "{{ cita.fecha }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>
<a href="{% url 'eliminar_cita' cita.id %}" class="btn btn-danger btn-sm">Eliminar</a>
{% endblock %}
