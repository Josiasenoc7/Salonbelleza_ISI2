{% extends 'base.html' %}
{% block content %}
<h1>Eliminar Cita Empleado</h1>
<p>¿Estás seguro de eliminar la relación entre la cita "{{ cita_empleado.cita }}" y el empleado "{{ cita_empleado.empleado }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>
<a href="{% url 'lista_cita_empleado' %}">Cancelar</a>
{% endblock %}
