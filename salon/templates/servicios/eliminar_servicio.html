{% extends 'base.html' %}
{% block content %}
<h1>Eliminar Servicio</h1>
<p>¿Estás seguro de que quieres eliminar el servicio "{{ servicio.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'lista_servicios' %}">Cancelar</a>
</form>
{% endblock %}
