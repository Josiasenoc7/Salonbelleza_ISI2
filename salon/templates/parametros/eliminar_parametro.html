{% extends 'base.html' %}
{% block content %}
<h1>Eliminar Parámetro</h1>
<p>¿Estás seguro de que quieres eliminar el parámetro "{{ parametro.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'lista_parametros' %}">Cancelar</a>
</form>
{% endblock %}
